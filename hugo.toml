languageCode = "en"
title = "iasds"
theme = "iasds"
relativeURLs = false

[params]
  author = "iasds"
  tagline = "Independent Researcher"
  research = "Internet freedom · Censorship resistance · Privacy-enhancing technologies"
  description = "iasds — Independent researcher: I2P network measurement, Qubes OS, privacy tools"
  github = "iasds"
  community = '<a href="https://t.me/qubeszh">Qubes OS Chinese Community</a>'
  bio = 'Hang Chen — privacy & anonymity researcher from Malaysia. I2P network measurement, censorship circumvention.'
  sponsor = 'Research funding welcome — <a href="mailto:fishtheclock@gmail.com">contact via email</a>, preferably PGP encrypted.'

[menu]
  [[menu.contact]]
    name = "Email"
